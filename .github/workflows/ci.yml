name: Public Repository CI

"on":
  push: {}
  pull_request: {}
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: >-
    public-ci-${{ github.workflow }}-${{
    github.event.pull_request.head.repo.full_name || github.repository }}-${{
    github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.logic-unit }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - logic-unit: core-calculation-export-validation
            node-version: 22.23.1
          - logic-unit: react-ui-browser-storage
            node-version: 22.23.1
          - logic-unit: pwa-service-worker
            node-version: 22.23.1
          - logic-unit: static-typescript-vite-build
            node-version: 22.23.1
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up the locked Node.js toolchain
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Verify the locked Node.js toolchain
        shell: bash
        env:
          NODE_VERSION: ${{ matrix.node-version }}
        run: |
          set -euo pipefail
          test "$(node --version)" = "v${NODE_VERSION}"

      - name: Install locked dependencies
        run: npm ci

      - name: Run the project validation logic unit
        shell: bash
        env:
          LOGIC_UNIT: ${{ matrix.logic-unit }}
        run: |
          set -euo pipefail

          case "$LOGIC_UNIT" in
            core-calculation-export-validation)
              npm run test:run -- \
                src/tests/download.test.ts \
                src/tests/expression.test.ts \
                src/tests/individualAngles.test.ts \
                src/tests/placement.test.ts \
                src/tests/rotation-export.test.ts \
                src/tests/validation.test.ts
              ;;
            react-ui-browser-storage)
              npm run test:run -- \
                src/tests/app-storage.test.ts \
                src/tests/distribution-graph.test.ts \
                src/tests/input-panel.test.tsx \
                src/tests/output-table.test.tsx \
                src/tests/presets.test.ts \
                src/tests/preview.test.tsx
              ;;
            pwa-service-worker)
              npm run test:run -- src/tests/pwa.test.ts
              ;;
            static-typescript-vite-build)
              npm run build
              ;;
            *)
              echo "::error::Unknown CI logic unit: $LOGIC_UNIT"
              exit 1
              ;;
          esac
